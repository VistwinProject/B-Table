name: Deploy to GitHub Pages

on:
  push:
    branches: ["藍白", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署,但不取消進行中的那個(免得半途中斷留下壞掉的站)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # --base=./ → 產出相對路徑。專案頁掛在 /B-Table/ 子路徑下,
      # 預設的 base=/ 會讓 assets 指到網域根目錄而全部 404。
      - run: npm run build -- --base=./

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
